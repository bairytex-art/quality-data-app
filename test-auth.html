<!DOCTYPE html>
<html>
<head>
    <title>Test Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #534AB7; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #443991; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <h1>Authentication Test</h1>
    
    <div id="status-check">
        <h2>Current Status</h2>
        <button onclick="checkStatus()">Check Authentication Status</button>
        <div id="status-result"></div>
    </div>

    <hr>

    <div id="login-form">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="login-result"></div>
    </div>

    <hr>

    <div id="test-api">
        <h2>Test Protected API</h2>
        <button onclick="testQualitiesAPI()">Test /api/qualities (should require auth)</button>
        <div id="api-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/auth/status`, {
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('status-result').innerHTML = 
                    `<div class="message ${data.authenticated ? 'success' : 'error'}">
                        Authenticated: ${data.authenticated}
                    </div>`;
            } catch (error) {
                document.getElementById('status-result').innerHTML = 
                    `<div class="message error">Error: ${error.message}</div>`;
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    document.getElementById('login-result').innerHTML = 
                        `<div class="message success">Login successful! ${data.message}</div>`;
                    // Check status after login
                    setTimeout(checkStatus, 500);
                } else {
                    document.getElementById('login-result').innerHTML = 
                        `<div class="message error">Login failed: ${data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML = 
                    `<div class="message error">Network error: ${error.message}</div>`;
            }
        }

        async function testQualitiesAPI() {
            try {
                const response = await fetch(`${API_BASE}/qualities`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('api-result').innerHTML = 
                        `<div class="message success">API accessible! Found ${data.length} qualities</div>`;
                } else {
                    const errorData = await response.json();
                    document.getElementById('api-result').innerHTML = 
                        `<div class="message error">API Error (${response.status}): ${errorData.error}</div>`;
                }
            } catch (error) {
                document.getElementById('api-result').innerHTML = 
                    `<div class="message error">Network error: ${error.message}</div>`;
            }
        }

        // Check status on page load
        window.onload = checkStatus;
    </script>
</body>
</html>
